[package]
name = "win_highperf_recorder"
version = "0.1.0"
edition = "2021"

[dependencies]
ringbuf = "0.3"
crossbeam-channel = "0.5"
mpeg2ts = "0.10"
once_cell = "1.20"
uuid = "1.6"

winapi = { version = "0.3", features = [
    "winbase", "winnt", "processthreadsapi", "handleapi", "mmdeviceapi",
    "audioclient", "audiosessiontypes", "combaseapi", "synchapi", "devguid",
    "stringapiset", "errhandlingapi", "dxgi", "dxgitype", "winuser", "securitybaseapi"
]}
